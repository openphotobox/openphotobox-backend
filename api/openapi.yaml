  /api/assets/storage/setup/:
    post:
      operationId: assets_storage_setup_create
      description: |-
        Simple storage setup - provide a path and we'll handle the rest.

        POST /api/storage/setup/
        {
            "path": "/home/user/photos"
        }

        This will:
        - Create a StorageBackend with the path
        - Create originals and thumbnails buckets
        - Set everything as default
        - Create the directory structure
      tags:
      - assets
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/assets/storage/status/:
    get:
      operationId: assets_storage_status_retrieve
      description: |-
        Simple storage status check.

        GET /api/storage/status/

        Returns:
        {
            "configured": true/false,
            "path": "/path/to/storage" or null
        }
      tags:
      - assets
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/assets/timeline/:
    get:
      operationId: assets_timeline_retrieve
      description: |-
        Return available photo dates and counts for the timeline sidebar.
        Groups by capture day (YYYY-MM-DD) using taken_at if present, else created_at.
      tags:
      - assets
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
  /api/assets/upload/config/:
    post:
      operationId: assets_upload_config_create
      description: |-
        Get upload configuration for local storage.

        POST /api/assets/upload/config/
        {
            "filename": "photo.jpg",
            "content_type": "image/jpeg"
        }
      tags:
      - assets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Asset'
          application/x-www-form-urlencoded:
            schema:
