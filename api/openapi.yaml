          description: ''
  /api/assets/ready-since/:
    get:
      operationId: assets_ready_since_retrieve
      description: |-
        Return assets that became ready (have a ready thumbnail) since a given ISO timestamp.
        Query params: since=ISO8601, limit (default 100)
      tags:
      - assets
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
