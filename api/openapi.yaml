openapi: 3.0.3
info:
  title: OpenPhotobox API
  version: 1.0.0
  description: Family photo management system with face recognition, albums, and sharing
paths:
  /api/admin/users/:
    get:
      operationId: admin_users_retrieve
      description: List users (GET) or create new user (POST) - admin only
      tags:
      - admin
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: admin_users_create
      description: List users (GET) or create new user (POST) - admin only
      tags:
      - admin
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/users/{user_id}/:
    put:
      operationId: admin_users_update
      description: Update user (admin only)
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: admin_users_partial_update
      description: Update user (admin only)
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/users/{user_id}/delete/:
    delete:
      operationId: admin_users_delete_destroy
      description: Delete user (admin only)
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/assets/:
    get:
      operationId: assets_list
      description: |-
        ViewSet for managing photo assets.
        Supports filtering by date, keywords, visibility, etc.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - assets
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssetList'
          description: ''
    post:
      operationId: assets_create
      description: |-
        ViewSet for managing photo assets.
        Supports filtering by date, keywords, visibility, etc.
      tags:
      - assets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Asset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Asset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Asset'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
  /api/assets/{id}/:
    get:
      operationId: assets_retrieve
      description: |-
        ViewSet for managing photo assets.
        Supports filtering by date, keywords, visibility, etc.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this asset.
        required: true
      tags:
      - assets
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
    put:
      operationId: assets_update
      description: |-
        ViewSet for managing photo assets.
        Supports filtering by date, keywords, visibility, etc.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this asset.
        required: true
      tags:
      - assets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Asset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Asset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Asset'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
    patch:
      operationId: assets_partial_update
      description: |-
        ViewSet for managing photo assets.
        Supports filtering by date, keywords, visibility, etc.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this asset.
        required: true
      tags:
      - assets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAsset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAsset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAsset'
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
    delete:
      operationId: assets_destroy
      description: |-
        ViewSet for managing photo assets.
        Supports filtering by date, keywords, visibility, etc.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this asset.
        required: true
      tags:
      - assets
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
