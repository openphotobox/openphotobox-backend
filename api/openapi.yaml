components:
  schemas:
    Album:
      type: object
      description: Serializer for photo Album model
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        cover_asset:
          type: string
          format: uuid
          nullable: true
        photo_count:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - photo_count
      - title
      - updated_at
    Asset:
      type: object
      description: Serializer for photo Asset model
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sha256:
          type: string
          readOnly: true
        storage_bucket:
          type: string
          format: uuid
        storage_bucket_name:
          type: string
          readOnly: true
        storage_backend_name:
          type: string
          readOnly: true
        storage_key:
          type: string
          maxLength: 1024
        storage_url:
          type: string
          readOnly: true
        storage_path:
          type: string
          readOnly: true
        mime_type:
          type: string
          maxLength: 100
        width:
          type: integer
          maximum: 2147483647
          minimum: 0
        height:
          type: integer
          maximum: 2147483647
          minimum: 0
        taken_at:
          type: string
          format: date-time
          nullable: true
        description:
          type: string
          description: User-provided description or caption for this photo
        keyword_names:
          type: array
          items:
            type: string
          readOnly: true
        phash:
          type: string
          maxLength: 16
        thumbnail_url:
          type: string
          readOnly: true
        thumbnail_urls:
          type: string
          readOnly: true
        original_url:
          type: string
          readOnly: true
        metadata:
          type: string
          readOnly: true
        faces:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - faces
      - height
      - id
      - keyword_names
      - metadata
      - mime_type
      - original_url
      - sha256
      - storage_backend_name
      - storage_bucket
      - storage_bucket_name
      - storage_key
      - storage_path
      - storage_url
      - thumbnail_url
      - thumbnail_urls
      - updated_at
      - width
    BackendTypeEnum:
      enum:
      - local
      type: string
      description: '* `local` - Local File System'
    Face:
      type: object
      description: Serializer for Face model
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        asset:
          type: string
          format: uuid
        asset_id:
          type: string
          readOnly: true
        person:
          type: string
          format: uuid
          nullable: true
        person_name:
          type: string
          readOnly: true
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        w:
          type: number
          format: double
        h:
          type: number
          format: double
        embedding:
          type: string
          format: byte
          readOnly: true
        quality:
          type: number
          format: double
        detection_confidence:
          type: number
          format: double
        thumbnail_url:
          type: string
          readOnly: true
        person_headshot_url:
          type: string
          readOnly: true
        detection_model:
          type: string
          maxLength: 100
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - asset
      - asset_id
      - created_at
      - embedding
      - h
      - id
      - person_headshot_url
      - person_name
      - quality
      - thumbnail_url
      - updated_at
      - w
      - x
      - y
    PaginatedAlbumList:
      type: object
      required:
