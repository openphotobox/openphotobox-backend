# Ruff configuration for OpenPhotobox backend
# Docs: https://docs.astral.sh/ruff/configuration/

target-version = "py312"
line-length = 120
indent-width = 4

[lint]
select = ["E", "F", "I"]
extend-ignore = ["E501"]

# Exclude generated / irrelevant paths
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*/migrations/*",
]

# Import sorting settings
[lint.isort]
known-first-party = ["openphotobox_backend", "assets", "people", "metadata", "sharing", "users"]
combine-as-imports = true
force-single-line = false
