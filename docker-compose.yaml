services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: archive
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: archive
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - minio
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data:/data
    command: /bin/sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    env_file:
      - .env
    depends_on:
      - backend
      - db
      - redis
      - minio
    volumes:
      - .:/app
      - ./data:/data
    command: python start_worker.py

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    env_file:
      - .env
    depends_on:
      - backend
      - db
      - redis
      - minio
    volumes:
      - .:/app
      - ./data:/data
    command: python start_beat.py

volumes:
  db-data:
  minio-data:
